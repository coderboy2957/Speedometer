<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Stark Varg Tacho</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Zwingend Montserrat in Black (900) und Italic -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@1,900&display=swap" rel="stylesheet">
    
    <style>
        html, body {
            height: 100%;
            width: 100%;
            margin: 0;
            padding: 0;
            overflow: hidden;
            background-color: #f3f4f6; /* Helle UI Vorgabe */
            font-family: 'Montserrat', sans-serif;
            font-style: italic;
            font-weight: 900;
            user-select: none;
            -webkit-user-select: none;
        }

        .rpm-path {
            /* Flüssige Animation der farbigen Linie ohne Stufen */
            transition: stroke-dashoffset 0.1s linear;
        }

        .glass-panel {
            background: rgba(255, 255, 255, 0.7);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
        }

        /* Verstecke Pfeile bei Input-Nummern für sauberes Design */
        input[type=number]::-webkit-inner-spin-button, 
        input[type=number]::-webkit-outer-spin-button { 
            -webkit-appearance: none; 
            margin: 0; 
        }
        input[type=number] {
            -moz-appearance: textfield;
        }
    </style>
</head>
<body class="flex items-center justify-center p-4 sm:p-8 w-screen h-screen">

    <!-- Haupt-Container Shape: großes Rechteck, stark abgerundet, weißer BG, Rahmen -->
    <div class="relative w-full h-full max-w-6xl max-h-[800px] bg-white rounded-[4rem] border-4 border-gray-200 shadow-2xl flex flex-col items-center justify-center p-4 overflow-hidden">
        
        <!-- Einstellungen Knopf (Oben Rechts) -->
        <button id="btnOpenSettings" class="absolute top-8 right-10 p-2 text-black hover:text-gray-500 transition-colors z-20 cursor-pointer">
            <svg xmlns="http://www.w3.org/2000/svg" class="h-10 w-10 sm:h-12 sm:w-12" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.5">
                <path stroke-linecap="round" stroke-linejoin="round" d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.065 2.572c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.572 1.065c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.065-2.572c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.572-1.065z" />
                <path stroke-linecap="round" stroke-linejoin="round" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z" />
            </svg>
        </button>

        <!-- SVG für die stufenlose RPM Anzeige mit der exakten geometrischen Form -->
        <svg class="absolute inset-0 w-full h-full pointer-events-none p-4 sm:p-10" viewBox="0 0 200 100" preserveAspectRatio="xMidYMid meet">
            <defs>
                <linearGradient id="rpmGradient" x1="0%" y1="0%" x2="100%" y2="0%">
                    <stop offset="0%" stop-color="#22c55e" /> <!-- Grün -->
                    <stop offset="50%" stop-color="#eab308" /> <!-- Gelb -->
                    <stop offset="100%" stop-color="#ef4444" /> <!-- Rot -->
                </linearGradient>
            </defs>
            
            <!-- Grauer Hintergrund-Pfad (Die Skizzen-Form) -->
            <path id="bgPath" d="M 15 85 L 45 30 Q 55 15 75 15 L 125 15 Q 145 15 155 30 L 185 85" fill="none" stroke="#e5e7eb" stroke-width="12" stroke-linecap="round" />
            
            <!-- Farbiger, animierter RPM-Pfad -->
            <path id="rpmFill" class="rpm-path" d="M 15 85 L 45 30 Q 55 15 75 15 L 125 15 Q 145 15 155 30 L 185 85" fill="none" stroke="url(#rpmGradient)" stroke-width="12" stroke-linecap="round" />
        </svg>

        <!-- Live Km/h Anzeige in der Mitte - Riesig, kein km/h Text darunter -->
        <div class="z-10 flex items-center justify-center mt-10">
            <!-- Extrem große Schrift, schräg, massiv (Montserrat 900 Italic ist über body definiert) -->
            <span id="speedValue" class="text-[35vmin] text-black leading-none tracking-tighter" style="text-shadow: 0 15px 40px rgba(0,0,0,0.1);">100</span>
        </div>
        
    </div>

    <!-- Dezenter Slider am unteren Rand zum Testen (Desktop/ohne GPS Bewegung) -->
    <div class="fixed bottom-4 left-1/2 transform -translate-x-1/2 w-64 opacity-30 hover:opacity-100 transition-opacity z-10 flex flex-col items-center">
        <label class="text-[10px] uppercase text-gray-500 mb-1 font-sans not-italic font-bold">Test-Simulator (km/h)</label>
        <input type="range" id="simSlider" min="0" max="150" value="100" class="w-full h-2 bg-gray-300 rounded-lg appearance-none cursor-pointer">
    </div>

    <!-- EINSTELLUNGEN FENSTER (Modal) -->
    <div id="settingsModal" class="fixed inset-0 z-50 flex items-center justify-center p-4 opacity-0 pointer-events-none transition-opacity duration-300">
        <!-- Blur Overlay -->
        <div class="absolute inset-0 bg-black/20 backdrop-blur-md"></div>
        
        <!-- Das Modal-Fenster -->
        <div class="glass-panel relative w-full max-w-lg p-8 sm:p-12 rounded-[3rem] border-2 border-white shadow-2xl flex flex-col items-center gap-8 transform scale-95 transition-transform duration-300" id="settingsCard">
            
            <div class="w-full flex flex-col gap-6 text-xl sm:text-2xl text-black">
                
                <!-- Zeile 1: Reifengröße -->
                <div class="flex items-center justify-between w-full border-b border-gray-300/50 pb-4">
                    <span>Reifengröße:</span>
                    <div class="flex items-center gap-2">
                        <input type="number" id="inputTireSize" value="19" step="0.5" class="w-20 bg-transparent border-b-2 border-black text-center focus:outline-none focus:border-gray-500">
                        <span>Zoll</span>
                    </div>
                </div>

                <!-- Zeile 2: Max. RPM -->
                <div class="flex items-center justify-between w-full border-b border-gray-300/50 pb-4">
                    <span>Max. RPM:</span>
                    <div class="flex items-center gap-2">
                        <input type="number" id="inputMaxRpm" value="10000" min="10" max="20000" class="w-28 bg-transparent border-b-2 border-black text-center focus:outline-none focus:border-gray-500">
                        <span class="text-sm text-gray-500 ml-2">10-10000</span>
                    </div>
                </div>

                <!-- Zeile 3: GPS Button -->
                <div class="w-full pt-2 flex flex-col items-center">
                    <button id="btnRequestGps" class="text-xl sm:text-2xl hover:text-gray-500 transition-colors border-b-2 border-transparent hover:border-gray-500 cursor-pointer">
                        GPS: Anfrage senden
                    </button>
                    <span id="gpsStatus" class="text-xs text-gray-500 mt-2 font-sans not-italic font-normal">Wartet auf Input</span>
                </div>
            </div>

            <!-- Button unten mittig: Fertig -->
            <button id="btnSaveClose" class="mt-4 px-12 py-3 bg-white border-2 border-black text-black hover:bg-black hover:text-white transition-colors rounded-full text-xl cursor-pointer">
                Fertig
            </button>
        </div>
    </div>

    <script>
        // State
        let currentSpeedKmh = 100; // Startwert passend zur Skizze
        let tireSizeZoll = 19;
        let maxRpm = 10000;
        let gpsWatchId = null;
        let pathLength = 0;

        // DOM Elements
        const rpmFill = document.getElementById('rpmFill');
        const speedValue = document.getElementById('speedValue');
        
        const settingsModal = document.getElementById('settingsModal');
        const settingsCard = document.getElementById('settingsCard');
        const btnOpenSettings = document.getElementById('btnOpenSettings');
        const btnSaveClose = document.getElementById('btnSaveClose');
        const btnRequestGps = document.getElementById('btnRequestGps');
        const gpsStatus = document.getElementById('gpsStatus');
        
        const inputTireSize = document.getElementById('inputTireSize');
        const inputMaxRpm = document.getElementById('inputMaxRpm');
        const simSlider = document.getElementById('simSlider');

        function initSvgPath() {
            pathLength = rpmFill.getTotalLength();
            rpmFill.style.strokeDasharray = pathLength;
            rpmFill.style.strokeDashoffset = pathLength; 
        }

        function updateDashboard() {
            // Update Number (No km/h text as per prompt)
            speedValue.textContent = Math.round(currentSpeedKmh);

            // Calculation Logic
            // Geschwindigkeit m/s = km/h / 3.6
            const speedMs = currentSpeedKmh / 3.6;
            // Durchmesser in Meter = Zoll * 0.0254
            const durchmesserM = tireSizeZoll * 0.0254;
            // Umfang = Durchmesser * PI
            const umfang = durchmesserM * Math.PI;
            
            // RPM = Geschwindigkeit (m/s) / Umfang * 60
            let calculatedRpm = 0;
            if (umfang > 0) {
                calculatedRpm = (speedMs / umfang) * 60;
            }

            // SVG Line Fill
            let fillPercentage = calculatedRpm / maxRpm;
            if (fillPercentage < 0) fillPercentage = 0;
            if (fillPercentage > 1) fillPercentage = 1;

            const offset = pathLength - (pathLength * fillPercentage);
            rpmFill.style.strokeDashoffset = offset;
        }

        function requestGps() {
            if (!("geolocation" in navigator)) {
                gpsStatus.textContent = "Nicht unterstützt.";
                return;
            }

            gpsStatus.textContent = "Erlaubnis anfragen...";

            if(gpsWatchId !== null) {
                navigator.geolocation.clearWatch(gpsWatchId);
            }

            gpsWatchId = navigator.geolocation.watchPosition(
                (position) => {
                    gpsStatus.textContent = "Aktiv";
                    gpsStatus.style.color = "#22c55e"; // Green
                    
                    let speed = position.coords.speed;
                    if (speed === null) speed = 0;
                    
                    currentSpeedKmh = speed * 3.6;
                    simSlider.value = currentSpeedKmh;
                    updateDashboard();
                },
                (error) => {
                    gpsStatus.textContent = "Fehler: " + error.message;
                    gpsStatus.style.color = "#ef4444"; // Red
                },
                {
                    enableHighAccuracy: true,
                    maximumAge: 0,
                    timeout: 5000
                }
            );
        }

        btnOpenSettings.addEventListener('click', () => {
            settingsModal.classList.remove('opacity-0', 'pointer-events-none');
            settingsCard.classList.remove('scale-95');
            settingsCard.classList.add('scale-100');
        });

        btnSaveClose.addEventListener('click', () => {
            tireSizeZoll = parseFloat(inputTireSize.value) || 19;
            maxRpm = parseFloat(inputMaxRpm.value) || 10000;
            
            settingsModal.classList.add('opacity-0', 'pointer-events-none');
            settingsCard.classList.remove('scale-100');
            settingsCard.classList.add('scale-95');
            
            updateDashboard();
        });

        btnRequestGps.addEventListener('click', requestGps);

        // Simulation Slider
        simSlider.addEventListener('input', (e) => {
            currentSpeedKmh = parseFloat(e.target.value);
            updateDashboard();
        });

        window.addEventListener('resize', () => {
            initSvgPath();
            updateDashboard();
        });

        // Initialize App
        initSvgPath();
        updateDashboard();
    </script>
</body>
</html>
