<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Stark Varg Tacho</title>
    <!-- Tailwind CSS für modernes, responsives Design -->
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        /* Stark Varg ähnlicher, sportlicher Font */
        @import url('https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,900;1,900&display=swap');
        
        body {
            font-family: 'Montserrat', sans-serif;
            background-color: #f3f4f6; /* Helle UI */
            user-select: none;
            -webkit-user-select: none;
        }

        .rpm-path {
            /* Flüssige Animation der farbigen Linie ohne Stufen */
            transition: stroke-dashoffset 0.15s linear;
        }

        /* Glassmorphism-Effekt für das Einstellungsfenster */
        .glass-panel {
            background: rgba(255, 255, 255, 0.85);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
        }
    </style>
</head>
<body class="flex items-center justify-center min-h-screen p-4 overflow-hidden">

    <!-- HAUPTANSICHT (Tacho) -->
    <div class="relative w-full max-w-3xl aspect-[16/9] sm:aspect-[2/1] bg-white rounded-[2.5rem] shadow-2xl overflow-hidden flex flex-col items-center justify-end p-8 border border-gray-100">
        
        <!-- Einstellungen Knopf (Oben Rechts) -->
        <button id="btnOpenSettings" class="absolute top-6 right-6 p-2 text-gray-300 hover:text-gray-800 transition-colors z-20 cursor-pointer">
            <svg xmlns="http://www.w3.org/2000/svg" class="h-10 w-10" viewBox="0 0 20 20" fill="currentColor">
                <path fill-rule="evenodd" d="M11.49 3.17c-.38-1.56-2.6-1.56-2.98 0a1.532 1.532 0 01-2.286.948c-1.372-.836-2.942.734-2.106 2.106.54.886.061 2.042-.947 2.287-1.561.379-1.561 2.6 0 2.978a1.532 1.532 0 01.947 2.287c-.836 1.372.734 2.942 2.106 2.106a1.532 1.532 0 012.287.947c.379 1.561 2.6 1.561 2.978 0a1.533 1.533 0 012.287-.947c1.372.836 2.942-.734 2.106-2.106a1.533 1.533 0 01.947-2.287c1.561-.379 1.561-2.6 0-2.978a1.532 1.532 0 01-.947-2.287c.836-1.372-.734-2.942-2.106-2.106a1.532 1.532 0 01-2.287-.947zM10 13a3 3 0 100-6 3 3 0 000 6z" clip-rule="evenodd" />
            </svg>
        </button>

        <!-- SVG für die stufenlose RPM Anzeige (Farbiger Bogen) -->
        <svg class="absolute top-0 left-0 w-full h-full pointer-events-none" viewBox="0 0 200 100" preserveAspectRatio="xMidYMax meet">
            <defs>
                <!-- Farbverlauf: Grün -> Gelb -> Rot -->
                <linearGradient id="rpmGradient" x1="0%" y1="0%" x2="100%" y2="0%">
                    <stop offset="0%" stop-color="#22c55e" />
                    <stop offset="60%" stop-color="#eab308" />
                    <stop offset="100%" stop-color="#ef4444" />
                </linearGradient>
            </defs>
            
            <!-- Grauer Hintergrund-Pfad (Die Skizzen-Form) -->
            <path id="bgPath" d="M 20 90 C 20 30, 60 20, 100 20 C 140 20, 180 30, 180 90" fill="none" stroke="#f3f4f6" stroke-width="7" stroke-linecap="round" />
            
            <!-- Farbiger, animierter RPM-Pfad -->
            <path id="rpmFill" class="rpm-path" d="M 20 90 C 20 30, 60 20, 100 20 C 140 20, 180 30, 180 90" fill="none" stroke="url(#rpmGradient)" stroke-width="7" stroke-linecap="round" />
        </svg>

        <!-- Live Km/h Anzeige in der Mitte -->
        <div class="z-10 flex flex-col items-center mb-2">
            <span id="speedValue" class="text-8xl md:text-[9rem] font-black italic tracking-tighter text-gray-900 leading-none">0</span>
            <span class="text-2xl md:text-3xl font-bold text-gray-400 uppercase tracking-widest mt-2">km/h</span>
        </div>
        
        <!-- Kleine Info-Anzeige für die berechneten RPM (Optional, aber hilfreich zur Kontrolle) -->
        <div class="absolute bottom-4 left-6 text-gray-400 text-sm font-bold">
            Live RPM: <span id="debugRpm">0</span>
        </div>
    </div>

    <!-- EINSTELLUNGEN FENSTER (Modal) -->
    <div id="settingsModal" class="fixed inset-0 z-50 flex items-center justify-center p-4 opacity-0 pointer-events-none transition-opacity duration-300">
        <!-- Dunkler Hintergrund Blur -->
        <div class="absolute inset-0 bg-black/20 backdrop-blur-sm"></div>
        
        <!-- Das eigentliche Einstellungs-Panel -->
        <div class="glass-panel relative w-full max-w-md p-8 rounded-3xl shadow-2xl border border-white/50 flex flex-col gap-6 transform scale-95 transition-transform duration-300" id="settingsCard">
            <h2 class="text-2xl font-black italic text-gray-800 uppercase tracking-wide">Einstellungen</h2>
            
            <div class="flex flex-col gap-4">
                <!-- Reifengröße -->
                <div class="flex items-center justify-between">
                    <label class="font-bold text-gray-700">Reifengröße:</label>
                    <div class="flex items-center gap-2">
                        <input type="number" id="inputTireSize" value="19" step="0.5" class="w-24 px-3 py-2 text-center font-bold bg-white border border-gray-300 rounded-xl focus:outline-none focus:ring-2 focus:ring-gray-800">
                        <span class="font-bold text-gray-500">Zoll</span>
                    </div>
                </div>

                <!-- Max RPM -->
                <div class="flex items-center justify-between">
                    <label class="font-bold text-gray-700">Max. RPM:</label>
                    <div class="flex items-center gap-2">
                        <input type="number" id="inputMaxRpm" value="10000" min="10" max="20000" class="w-24 px-3 py-2 text-center font-bold bg-white border border-gray-300 rounded-xl focus:outline-none focus:ring-2 focus:ring-gray-800">
                    </div>
                </div>

                <hr class="border-gray-200 my-2">

                <!-- GPS Anfrage Button -->
                <button id="btnRequestGps" class="w-full py-4 bg-gray-100 hover:bg-gray-200 text-gray-800 font-bold rounded-xl transition-colors flex items-center justify-center gap-2">
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" viewBox="0 0 20 20" fill="currentColor">
                        <path fill-rule="evenodd" d="M5.05 4.05a7 7 0 119.9 9.9L10 18.9l-4.95-4.95a7 7 0 010-9.9zM10 11a2 2 0 100-4 2 2 0 000 4z" clip-rule="evenodd" />
                    </svg>
                    GPS: Anfrage senden
                </button>
                <div id="gpsStatus" class="text-xs text-center text-gray-500 font-medium">Status: Wartend...</div>

                <!-- Simulierter Slider zum Testen ohne sich bewegen zu müssen -->
                <div class="mt-4 p-4 bg-blue-50 rounded-xl border border-blue-100">
                    <label class="text-xs text-blue-800 font-bold uppercase mb-2 block">Test-Schieberegler (Simulation)</label>
                    <input type="range" id="simSlider" min="0" max="150" value="0" class="w-full">
                </div>
            </div>

            <!-- Fertig = Speichern Knopf -->
            <button id="btnSaveClose" class="mt-2 w-full py-4 bg-gray-900 hover:bg-black text-white font-black italic uppercase rounded-xl transition-colors shadow-lg">
                Fertig
            </button>
        </div>
    </div>

    <script>
        // --- Variablen & State ---
        let currentSpeedKmh = 0;
        let tireSizeZoll = 19;
        let maxRpm = 10000;
        let gpsWatchId = null;
        let pathLength = 0;

        // --- DOM Elemente ---
        const rpmFill = document.getElementById('rpmFill');
        const speedValue = document.getElementById('speedValue');
        const debugRpm = document.getElementById('debugRpm');
        
        const settingsModal = document.getElementById('settingsModal');
        const settingsCard = document.getElementById('settingsCard');
        const btnOpenSettings = document.getElementById('btnOpenSettings');
        const btnSaveClose = document.getElementById('btnSaveClose');
        const btnRequestGps = document.getElementById('btnRequestGps');
        const gpsStatus = document.getElementById('gpsStatus');
        
        const inputTireSize = document.getElementById('inputTireSize');
        const inputMaxRpm = document.getElementById('inputMaxRpm');
        const simSlider = document.getElementById('simSlider');

        // --- Initialisierung der SVG Pfad-Länge ---
        function initSvgPath() {
            // Holt die exakte Länge der gezeichneten Kurve für die Animation
            pathLength = rpmFill.getTotalLength();
            rpmFill.style.strokeDasharray = pathLength;
            rpmFill.style.strokeDashoffset = pathLength; // Startet leer
        }

        // --- Berechnung & UI Update ---
        function updateDashboard() {
            // 1. Text für Km/h updaten
            speedValue.textContent = Math.round(currentSpeedKmh);

            // 2. RPM ausrechnen anhand der Reifengröße[span_3](start_span)[span_3](end_span)
            // Durchmesser in Meter: Zoll * 0.0254
            const durchmesserM = tireSizeZoll * 0.0254;
            // Umfang (Kreis) in Meter: Durchmesser * PI
            const umfang = durchmesserM * Math.PI;
            // Geschwindigkeit in m/s
            const speedMs = currentSpeedKmh / 3.6;
            // Umdrehungen pro Sekunde (Revs per second)
            const rps = speedMs / umfang;
            // RPM (Revs per minute)
            const calculatedRpm = rps * 60;

            debugRpm.textContent = Math.round(calculatedRpm);

            // 3. Farbigen Bogen aktualisieren[span_4](start_span)[span_4](end_span)
            // Anteil an der eingestellten Max RPM berechnen
            let fillPercentage = calculatedRpm / maxRpm;
            
            // Begrenzung zwischen 0 und 1 (0% bis 100%)
            if (fillPercentage < 0) fillPercentage = 0;
            if (fillPercentage > 1) fillPercentage = 1;

            // Offset berechnen (pathLength ist leer, 0 ist voll)
            const offset = pathLength - (pathLength * fillPercentage);
            rpmFill.style.strokeDashoffset = offset;
        }

        // --- GPS Logik ---
        function requestGps() {
            if (!("geolocation" in navigator)) {
                gpsStatus.textContent = "GPS wird vom Gerät nicht unterstützt.";
                gpsStatus.classList.add("text-red-500");
                return;
            }

            gpsStatus.textContent = "Warte auf iPhone/Geräte Erlaubnis...";
            gpsStatus.classList.remove("text-red-500", "text-green-500");

            // GPS Anfrage senden[span_5](start_span)[span_5](end_span)
            gpsWatchId = navigator.geolocation.watchPosition(
                (position) => {
                    gpsStatus.textContent = "GPS Aktiv - Empfange Daten";
                    gpsStatus.classList.add("text-green-500");
                    
                    // position.coords.speed ist in m/s, umrechnen in km/h
                    let speed = position.coords.speed;
                    if (speed === null) speed = 0; // Fallback, falls kein Speed gesendet wird
                    
                    currentSpeedKmh = speed * 3.6;
                    
                    // Sim-Slider anpassen, damit UI synchron bleibt
                    simSlider.value = currentSpeedKmh;
                    updateDashboard();
                },
                (error) => {
                    gpsStatus.textContent = "Fehler: " + error.message;
                    gpsStatus.classList.add("text-red-500");
                },
                {
                    enableHighAccuracy: true, // Zwingend für genauen Live-Standort[span_6](start_span)[span_6](end_span)
                    maximumAge: 0,
                    timeout: 5000
                }
            );
        }

        // --- Event Listener ---
        
        // Modal öffnen
        btnOpenSettings.addEventListener('click', () => {
            settingsModal.classList.remove('opacity-0', 'pointer-events-none');
            settingsCard.classList.remove('scale-95');
            settingsCard.classList.add('scale-100');
        });

        // Modal schließen & Speichern (Fertig Knopf)[span_7](start_span)[span_7](end_span)
        btnSaveClose.addEventListener('click', () => {
            // Werte übernehmen
            tireSizeZoll = parseFloat(inputTireSize.value) || 19;
            maxRpm = parseFloat(inputMaxRpm.value) || 10000;
            
            // Modal ausblenden
            settingsModal.classList.add('opacity-0', 'pointer-events-none');
            settingsCard.classList.remove('scale-100');
            settingsCard.classList.add('scale-95');
            
            // UI sofort mit neuen Settings updaten
            updateDashboard();
        });

        // GPS Button
        btnRequestGps.addEventListener('click', requestGps);

        // Simulator Slider (Zum Testen am Schreibtisch)
        simSlider.addEventListener('input', (e) => {
            currentSpeedKmh = parseFloat(e.target.value);
            updateDashboard();
        });

        // --- Start ---
        initSvgPath();
        updateDashboard();
    </script>
</body>
</html>
